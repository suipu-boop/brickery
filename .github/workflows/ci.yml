name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 内核导入冒烟
        run: python -c "import brickery; print('brickery import OK')"

  alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 一致性校验（仓库层 + 远端层）
        run: |
          bash -n scripts/check_alignment.sh
          bash scripts/check_alignment.sh --scope=repo
